<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AITranslate</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="/assets/images/parrot.png" alt="Parrot flying with stars around it">
        <div class="main-title">
            <h1>PollyGlot</h1>
            <span>Perfect Translation Every Time</span>
        </div>
    </header>

    <main>
        <!-- Screen 1: input -->
        <section id="form-section">
            <form id="translate-form" class="card">
                <div class="field-group">
                    <label for="text-input">Text to translate 👇</label>
                    <textarea id="text-input" class="text-input" placeholder="Enter your text" maxlength="1000" required></textarea>
                </div>

                <div class="form-bottom">
                    <p>Select language 👇</p>
                    <div class="lang-options">
                        <div class="lang-option">
                            <input type="radio" id="french" name="lang" value="French">
                            <label for="french">French<img class="flag" src="/assets/images/fr-flag.png" alt="France flag"></label>
                        </div>

                        <div class="lang-option">
                            <input type="radio" id="spanish" name="lang" value="Spanish" checked>
                            <label for="spanish">Spanish<img class="flag" src="/assets/images/sp-flag.png" alt="Spain flag"></label>
                        </div>

                        <div class="lang-option">
                            <input type="radio" id="japanese" name="lang" value="Japanese">
                            <label for="japanese">Japanese<img class="flag" src="/assets/images/jpn-flag.png" alt="Japan flag"></label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn" id="translate-btn">Translate</button>
                <p id="error" class="error" role="alert"></p>
            </form>
        </section>

        <!-- Screen 2: result -->
        <section id="translation-section" class="hidden">
            <div class="card">
                <div class="field-group">
                    <label for="original-text">Original text</label>
                    <textarea id="original-text" class="text-input" readonly></textarea>
                </div>

                <div class="field-group">
                    <label for="translation-text">Your translation</label>
                    <textarea id="translation-text" class="text-input" readonly></textarea>
                </div>

                <button type="button" class="btn" id="reset-btn">Start Over</button>
            </div>
        </section>
    </main>

    <script type="module" src="index.js"></script>
</body>
</html>
