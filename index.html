<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <title>AITranslate</title>
</head>
<body>
    <header>
        <img src="/assets/images/parrot.png" alt="parot flying with stars around it">
        <div class="main-title">
        <h1>PollyGlot</h1>
        <span>Perfect Translation Every Time</span>
        </div>
    </header>
    <main>
        <section id="form-section">
            <form>
                <div class="form-top">
                    <label for="text-input">Text to translate 👇</label>
                    <textarea id="text-input" class="text-input" placeholder="Enter your text" required></textarea>
                </div>
                <div class="form-bottom">
                    <p>Select language 👇</p>
                    <div class="lang-options">
                        <div class="lang-option">
                            <input type="radio" id="french" name="lang" value="French">
                            <label for="french">French<img class="flag" src="/assets/images/fr-flag.png" alt="France flag"></label>
                        </div>

                        <div class="lang-option">
                            <input type="radio" id="spanish" name="lang" value="Spanish" checked>
                            <label for="spanish">Spanish<img class="flag" src="/assets/images/sp-flag.png" alt="Spain flag"></label>
                        </div>

                        <div class="lang-option">
                            <input type="radio" id="japanese" name="lang" value="Japanese">
                            <label for="japanese">Japanese<img class="flag" src="/assets/images/jpn-flag.png" alt="Japan flag"></label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn" id="translate-btn">Translate</button>
                <p id="error" class="error"></p>
            </form>
        </section>
        <section id="translation-section" class="hidden">
            <form>
                <div class="form-top">
                    <label for="original-text">Original text</label>
                    <textarea id="original-text" class="text-input" readonly></textarea>
                </div>

                <div class="section-bottom">
                    <label for="translation-text">Your translation</label>
                    <textarea id="translation-text" class="text-input" readonly></textarea>
                </div>

                <button type="button" class="btn" id="reset-btn">Start Over</button>
            </form>
        </section>
    </main>
    <script src="index.js" type="module"></script>
</body>
</html>
